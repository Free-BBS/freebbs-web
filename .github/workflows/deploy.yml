name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-bbs-production
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate project
        run: bash scripts/ci-validate.sh

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/data/www/free-BBS' }}
      FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME || 'free-bbs-frontend' }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'free-bbs-backend' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'http://127.0.0.1:3001/api/health' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package release
        run: |
          set -euo pipefail
          ARCHIVE_PATH="/tmp/free-bbs-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='database/uploads' \
            -czf "$ARCHIVE_PATH" .

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release artifact
        run: |
          set -euo pipefail
          ARCHIVE_PATH="/tmp/free-bbs-${GITHUB_SHA}.tar.gz"
          scp -P "$DEPLOY_PORT" "$ARCHIVE_PATH" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/free-bbs-${GITHUB_SHA}.tar.gz"

      - name: Deploy on app server
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             RELEASE_DIR=/tmp/free-bbs-release-${GITHUB_SHA}; \
             ARCHIVE_PATH=/tmp/free-bbs-${GITHUB_SHA}.tar.gz; \
             trap 'rm -rf \"\$RELEASE_DIR\" \"\$ARCHIVE_PATH\"' EXIT; \
             rm -rf \"\$RELEASE_DIR\"; \
             mkdir -p \"\$RELEASE_DIR\"; \
             tar -xzf \"\$ARCHIVE_PATH\" -C \"\$RELEASE_DIR\"; \
             cd \"\$RELEASE_DIR\"; \
             DEPLOY_DIR='$DEPLOY_PATH' \
             FRONTEND_SERVICE_NAME='$FRONTEND_SERVICE_NAME' \
             BACKEND_SERVICE_NAME='$BACKEND_SERVICE_NAME' \
             RUN_DB_MIGRATIONS='0' \
             HEALTHCHECK_URL='$HEALTHCHECK_URL' \
             bash scripts/deploy.sh"
