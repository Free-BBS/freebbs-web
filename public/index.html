<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FREE-BBS | 电子系学生自主学习平台</title>
    <meta
      name="description"
      content="FREE-BBS 是由学生维护的电子系自主学习平台，连接课程知识地图、讨论区和 Max 学习助手。"
    />
    <meta property="og:title" content="FREE-BBS | 电子系学生自主学习平台" />
    <meta property="og:description" content="把课程脉络、真实讨论和项目探索放进同一个学习现场。" />
    <meta property="og:image" content="/assets/homebg.webp" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
  </head>
  <body class="home-page">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <form class="searchbar" role="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input type="search" placeholder="搜索课程、讨论、资料、地图坐标" aria-label="搜索" />
        </form>

        <nav class="nav-actions" aria-label="顶部导航">
          <a class="nav-link" href="/">
            <img class="nav-icon" src="/assets/icons/home.svg" alt="" aria-hidden="true" />
            <span>主页</span>
          </a>
          <a class="nav-link" href="/world">
            <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
            <span>学习世界</span>
          </a>
          <a class="nav-link" href="/discussion">
            <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
            <span>讨论</span>
          </a>
          <a class="nav-link" href="/aichat">
            <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
            <span>问问 Max</span>
          </a>
          <a class="nav-link fortune-link hidden" href="#">
            <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
            <span>今日运势</span>
          </a>
          <a class="nav-link manage-link hidden" href="/adminusers">
            <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
            <span>管理</span>
          </a>

          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status">
              <span class="currency currency-electric" data-tooltip="电元" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="电元" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" data-tooltip="磁元" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="磁元" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航">
        <a class="nav-link" href="/world">
          <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
          <span>学习世界</span>
        </a>
        <a class="nav-link" href="/discussion">
          <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
          <span>讨论</span>
        </a>
        <a class="nav-link" href="/aichat">
          <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
          <span>问问 Max</span>
        </a>
        <a class="nav-link fortune-link hidden" href="#">
          <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
          <span>今日运势</span>
        </a>
        <a class="nav-link manage-link hidden" href="/adminusers">
          <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
          <span>管理</span>
        </a>
      </nav>

      <main class="main-content home-dashboard-main">
        <h1 class="visually-hidden">FREE-BBS 社区首页</h1>

        <div class="home-dashboard">
          <section class="home-dashboard-panel home-feed-panel" aria-labelledby="home-feed-title">
            <header class="home-panel-header">
              <div>
                <p class="home-panel-kicker">Discussion</p>
                <h2 id="home-feed-title">讨论区动态</h2>
              </div>
              <div class="home-panel-actions">
                <a class="home-panel-link" href="/discussion">进入讨论区</a>
                <button
                  class="home-feed-toggle"
                  id="home-feed-toggle"
                  type="button"
                  aria-pressed="true"
                  aria-controls="home-discussion-list"
                  aria-label="热帖优先"
                >
                  <span class="home-feed-toggle-label">排序</span>
                  <strong id="home-feed-mode-label">热帖</strong>
                </button>
              </div>
            </header>

            <p class="visually-hidden" id="home-feed-status" role="status" aria-live="polite">
              正在加载热帖…
            </p>
            <div
              class="home-feed-list"
              id="home-discussion-list"
              role="list"
              aria-busy="true"
              aria-describedby="home-feed-status"
            >
              <article class="home-feed-loading-item" aria-hidden="true">
                <span class="home-loading-kicker"></span>
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </article>
              <article class="home-feed-loading-item" aria-hidden="true">
                <span class="home-loading-kicker"></span>
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </article>
              <article class="home-feed-loading-item" aria-hidden="true">
                <span class="home-loading-kicker"></span>
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </article>
              <article class="home-feed-loading-item" aria-hidden="true">
                <span class="home-loading-kicker"></span>
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </article>
              <article class="home-feed-loading-item" aria-hidden="true">
                <span class="home-loading-kicker"></span>
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </article>
            </div>
          </section>

          <section class="home-dashboard-panel home-board-panel" aria-labelledby="home-board-title">
            <header class="home-panel-header">
              <div>
                <p class="home-panel-kicker">Boards</p>
                <h2 id="home-board-title">分区互动</h2>
              </div>
              <a class="home-panel-link" href="/discussion">查看全部</a>
            </header>

            <p class="visually-hidden" id="home-board-status" role="status" aria-live="polite">
              正在加载分区互动数据…
            </p>
            <div
              class="home-board-activity"
              id="home-board-activity"
              role="list"
              aria-busy="true"
              aria-describedby="home-board-status"
            >
              <div class="home-board-loading-item" aria-hidden="true">
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </div>
              <div class="home-board-loading-item" aria-hidden="true">
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </div>
              <div class="home-board-loading-item" aria-hidden="true">
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </div>
              <div class="home-board-loading-item" aria-hidden="true">
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </div>
              <div class="home-board-loading-item" aria-hidden="true">
                <span class="home-loading-title"></span>
                <span class="home-loading-meta"></span>
              </div>
            </div>
          </section>

          <section
            class="home-dashboard-panel home-heat-panel"
            id="landing-heat-leaderboard"
            aria-labelledby="home-heat-title"
          >
            <header class="home-panel-header">
              <div>
                <p class="home-panel-kicker">Heat</p>
                <h2 id="home-heat-title">热力榜前五</h2>
              </div>
            </header>

            <p class="visually-hidden" id="home-heat-status" role="status" aria-live="polite">
              正在加载热力榜…
            </p>
            <ol
              class="home-heat-list"
              id="landing-heat-list"
              aria-busy="true"
              aria-describedby="home-heat-status"
              aria-label="热力榜前五名"
            >
              <li class="home-heat-loading-item" aria-hidden="true">
                <span class="home-loading-rank"></span>
                <span class="home-loading-avatar"></span>
                <span class="home-loading-title"></span>
              </li>
              <li class="home-heat-loading-item" aria-hidden="true">
                <span class="home-loading-rank"></span>
                <span class="home-loading-avatar"></span>
                <span class="home-loading-title"></span>
              </li>
              <li class="home-heat-loading-item" aria-hidden="true">
                <span class="home-loading-rank"></span>
                <span class="home-loading-avatar"></span>
                <span class="home-loading-title"></span>
              </li>
              <li class="home-heat-loading-item" aria-hidden="true">
                <span class="home-loading-rank"></span>
                <span class="home-loading-avatar"></span>
                <span class="home-loading-title"></span>
              </li>
              <li class="home-heat-loading-item" aria-hidden="true">
                <span class="home-loading-rank"></span>
                <span class="home-loading-avatar"></span>
                <span class="home-loading-title"></span>
              </li>
            </ol>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <div class="footer-block footer-left">
          <p>© Free-bbs 工作组 2026-2027</p>
        </div>

        <div class="footer-block footer-center">
          <div class="footer-links">
            <a href="#staff">工作人员名单</a>
            <a href="https://www.ee.tsinghua.edu.cn/" target="_blank" rel="noreferrer"
              >清华大学电子系</a
            >
            <a href="https://www.eesast.com">电子系学生科协</a>
          </div>
          <p>&lt;京ICP备2025155858号-2&gt;</p>
        </div>

        <div class="footer-block footer-right">
          <p><a href="mailto:feedback@free-bbs.cn">反馈：feedback@free-bbs.cn</a></p>
        </div>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
