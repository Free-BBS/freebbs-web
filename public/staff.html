<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FREE BBS 工作人员名单 | FREE BBS</title>
    <meta name="description" content="FREE BBS 工作人员名单，页面建设中，暂未开放" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/site-info.css" />
  </head>
  <body class="site-info-page">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="主导航">
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status"></div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航"></nav>

      <main class="main-content site-info-main">
        <section class="site-info-card" aria-labelledby="site-info-title">
          <div class="site-info-copy">
            <p class="site-info-eyebrow" lang="en">THE PEOPLE BEHIND FREE BBS</p>
            <h1 id="site-info-title"><span>FREE BBS</span> <span>工作人员名单</span></h1>
            <p class="site-info-status"><span aria-hidden="true"></span>建设中 · 暂未开放</p>
            <p class="site-info-description">
              这里将记录共同建设 FREE BBS 的伙伴，工作人员名单暂未开放，Max 正在施工
            </p>
            <nav class="site-info-actions" aria-label="继续探索">
              <a class="site-info-primary" href="/">返回首页 <span aria-hidden="true">↗</span></a>
              <a href="/guide">先看看 Max 的探索手册 <span aria-hidden="true">→</span></a>
            </nav>
          </div>
          <figure class="site-info-scene">
            <img
              src="/assets/development-construction-bbs-v2.webp"
              width="1536"
              height="1024"
              alt="Max 开着挖掘机建设 FREE BBS，地面上挖出了 BBS 字样"
            />
            <figcaption>这片小天地，正在一点点建起来</figcaption>
          </figure>
        </section>
      </main>
      <footer class="site-footer site-footer-compact">
        <nav class="footer-links" aria-label="关于平台">
          <a href="/about">关于 FREE BBS</a>
          <a href="/staff">FREE BBS 工作人员名单</a>
          <a href="https://www.ee.tsinghua.edu.cn/" target="_blank" rel="noreferrer"
            >清华大学电子系</a
          >
          <a href="https://www.eesast.com">电子系学生科协</a>
        </nav>
        <div class="footer-meta">
          <p>© 2026-2027 FREE BBS 工作组</p>
          <p>京ICP备2025155858号-2</p>
        </div>
      </footer>
    </div>
    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
