<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FREE BBS 工作人员名单 | FREE BBS</title>
    <meta
      name="description"
      content="认识共同建设 FREE BBS 的伙伴，查看产品设计与总负责人、课程部、技术部和战略部工作人员介绍。"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/site-info.css" />
    <link rel="stylesheet" href="/staff.css" />
  </head>
  <body class="site-info-page staff-page">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="主导航">
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status"></div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航"></nav>

      <main class="main-content site-info-main staff-main">
        <header class="staff-intro" aria-labelledby="staff-title">
          <p class="staff-eyebrow" lang="en">THE PEOPLE BEHIND FREE BBS</p>
          <h1 id="staff-title">FREE BBS 工作人员名单</h1>
          <p class="staff-description">认识共同建设这片学习天地的伙伴。</p>
          <p class="staff-date" id="staff-date"></p>
        </header>

        <section class="staff-directory" aria-label="工作人员名录">
          <div class="staff-toolbar">
            <div class="staff-filters" role="group" aria-label="按栏目查看">
              <button
                type="button"
                class="staff-filter"
                data-staff-group="产品设计·总负责人"
                aria-pressed="true"
                disabled
              >
                产品设计·总负责人 <span data-staff-count="产品设计·总负责人"></span>
              </button>
              <button
                type="button"
                class="staff-filter"
                data-staff-group="课程部"
                aria-pressed="false"
                disabled
              >
                课程部 <span data-staff-count="课程部"></span>
              </button>
              <button
                type="button"
                class="staff-filter"
                data-staff-group="技术部"
                aria-pressed="false"
                disabled
              >
                技术部 <span data-staff-count="技术部"></span>
              </button>
              <button
                type="button"
                class="staff-filter"
                data-staff-group="战略部"
                aria-pressed="false"
                disabled
              >
                战略部 <span data-staff-count="战略部"></span>
              </button>
            </div>
            <div class="staff-course-section" id="staff-course-section" hidden>
              <div class="staff-filters" role="group" aria-label="按课程部组别查看">
                <button
                  type="button"
                  class="staff-filter"
                  data-staff-course-group="数学组"
                  aria-pressed="true"
                  disabled
                >
                  数学组 <span data-staff-course-count="数学组"></span>
                </button>
                <button
                  type="button"
                  class="staff-filter"
                  data-staff-course-group="电路组"
                  aria-pressed="false"
                  disabled
                >
                  电路组 <span data-staff-course-count="电路组"></span>
                </button>
                <button
                  type="button"
                  class="staff-filter"
                  data-staff-course-group="信号组"
                  aria-pressed="false"
                  disabled
                >
                  信号组 <span data-staff-course-count="信号组"></span>
                </button>
                <button
                  type="button"
                  class="staff-filter"
                  data-staff-course-group="待确认"
                  aria-pressed="false"
                  disabled
                  hidden
                >
                  待确认 <span data-staff-course-count="待确认"></span>
                </button>
              </div>
            </div>
            <p class="staff-status" id="staff-status" role="status" aria-live="polite">
              正在加载名录…
            </p>
          </div>
          <button type="button" class="staff-retry" id="staff-retry" hidden>重新加载名录</button>
          <p class="staff-empty" id="staff-empty" hidden></p>
          <div class="staff-grid" id="staff-grid" aria-busy="true"></div>
          <noscript><p>请启用 JavaScript 查看工作人员名录。</p></noscript>
        </section>
      </main>
      <footer class="site-footer site-footer-compact">
        <nav class="footer-links" aria-label="关于平台">
          <a href="/about">关于 FREE BBS</a>
          <a href="/staff">FREE BBS 工作人员名单</a>
          <a href="https://www.ee.tsinghua.edu.cn/" target="_blank" rel="noreferrer"
            >清华大学电子系</a
          >
          <a href="https://www.eesast.com">电子系学生科协</a>
        </nav>
        <div class="footer-meta">
          <p>© 2026-2027 FREE BBS 工作组</p>
          <p>京ICP备2025155858号-2</p>
        </div>
      </footer>
    </div>
    <dialog class="staff-photo-dialog" id="staff-photo-dialog" aria-labelledby="staff-photo-name">
      <div class="staff-photo-header">
        <h2 class="staff-photo-heading" id="staff-photo-name"></h2>
        <button type="button" class="staff-photo-close" id="staff-photo-close" autofocus>
          关闭照片
        </button>
      </div>
      <p class="staff-photo-status" id="staff-photo-status" role="status" hidden></p>
      <img class="staff-photo-image" id="staff-photo-image" alt="" />
    </dialog>
    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
    <script src="/staff.js"></script>
  </body>
</html>
