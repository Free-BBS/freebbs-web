<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="/development-commerce-embed.js"></script>
    <title>FREE-BBS - 电磁场</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/economy.css" />
    <link rel="stylesheet" href="/profile-extras.css" />
    <link rel="stylesheet" href="/shop-presentation.css" />
    <link rel="stylesheet" href="/development-commerce-embed.css" />
  </head>
  <!-- Shared cosmetics keep the same theme tokens as the surrounding page. -->
  <body class="electromagnetic-page economy-page">
    <div class="page-shell page-shell-settings">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>
        <form class="searchbar" role="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input type="search" placeholder="搜索课程、讨论、资料、地图坐标" aria-label="搜索" />
        </form>
        <nav class="nav-actions" aria-label="顶部导航">
          <a class="nav-link" href="/">
            <img class="nav-icon" src="/assets/icons/home.svg" alt="" aria-hidden="true" />
            <span>主页</span>
          </a>
          <a class="nav-link" href="/world">
            <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
            <span>学习世界</span>
          </a>
          <a class="nav-link" href="/discussion">
            <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
            <span>讨论</span>
          </a>
          <a class="nav-link" href="/aichat">
            <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
            <span>问问 Max</span>
          </a>
          <a class="nav-link fortune-link hidden" href="#">
            <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
            <span>今日运势</span>
          </a>
          <a
            class="nav-link electromagnetic-link hidden is-active"
            href="/electromagnetic"
            aria-current="page"
          >
            <img class="nav-icon" src="/assets/icons/battery.svg" alt="" aria-hidden="true" />
            <span>电磁场</span>
          </a>
          <a class="nav-link inventory-link hidden" href="/inventory">
            <img class="nav-icon" src="/assets/icons/inventory.svg" alt="" aria-hidden="true" />
            <span>仓库</span>
          </a>
          <a class="nav-link manage-link hidden" href="/adminusers">
            <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
            <span>管理</span>
          </a>
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status">
              <span class="currency currency-electric" data-tooltip="电元" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="电元" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" data-tooltip="磁元" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="磁元" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>
      <nav class="mobile-nav" aria-label="手机底部导航">
        <a class="nav-link" href="/world">
          <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
          <span>学习世界</span>
        </a>
        <a class="nav-link" href="/discussion">
          <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
          <span>讨论</span>
        </a>
        <a class="nav-link" href="/aichat">
          <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
          <span>问问 Max</span>
        </a>
        <a class="nav-link fortune-link hidden" href="#">
          <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
          <span>今日运势</span>
        </a>
        <a
          class="nav-link electromagnetic-link hidden is-active"
          href="/electromagnetic"
          aria-current="page"
        >
          <img class="nav-icon" src="/assets/icons/battery.svg" alt="" aria-hidden="true" />
          <span>电磁场</span>
        </a>
        <a class="nav-link inventory-link hidden" href="/inventory">
          <img class="nav-icon" src="/assets/icons/inventory.svg" alt="" aria-hidden="true" />
          <span>仓库</span>
        </a>
      </nav>
      <main class="main-content settings-main economy-main">
        <section class="economy-auth-required" aria-label="登录后进入电磁场">
          <p class="shop-eyebrow">FREE BBS · 好奇心补给站</p>
          <h1>电磁场商城</h1>
          <p>登录后可以购买资产，并进入仓库使用物品。购买时消耗的电元或磁元会转化为热力。</p>
          <a class="aichat-auth-link" href="/login">登录 / 注册</a>
        </section>
        <section class="economy-shell" aria-label="电磁场商店">
          <header class="economy-header shop-hero">
            <div class="shop-hero-copy">
              <p class="shop-eyebrow">FREE BBS · 好奇心补给站</p>
              <h1>电磁场商城</h1>
              <p>把学习攒下的电元与磁元，换成一点自己的颜色。</p>
              <a class="economy-inventory-link" href="/inventory">
                <img src="/assets/icons/inventory.svg" alt="" aria-hidden="true" />
                <span>打开我的仓库</span>
                <span aria-hidden="true">↗</span>
              </a>
            </div>
            <div class="shop-hero-art" aria-hidden="true">
              <span class="shop-hero-orbit" data-shop-cosmetic-preview="frame_orbit"></span>
              <span class="shop-hero-max" data-shop-ranch-preview></span>
              <span class="shop-hero-fish">
                <img src="/assets/shop/max-cartoon-v1/fish.webp" alt="" />
              </span>
            </div>
          </header>
          <div class="economy-balance-row" id="economy-balance-row"></div>
          <section class="shop-catalog" aria-label="商店商品">
            <div class="economy-section-head">
              <h2>逛逛小店</h2>
              <p
                id="economy-message"
                class="discussion-message"
                role="status"
                aria-live="polite"
              ></p>
            </div>
            <nav class="shop-category-nav" aria-label="商品分类">
              <a href="#shop-section-appearance">
                <span
                  class="shop-category-sample"
                  data-shop-cosmetic-preview="frame_orbit"
                  aria-hidden="true"
                ></span>
                <span>装扮</span>
                <small>添一点自己的颜色</small>
              </a>
              <a href="#shop-section-collection">
                <img
                  src="/assets/shop/max-cartoon-v1/mysterious_fragment.webp"
                  alt=""
                  aria-hidden="true"
                />
                <span>收藏</span>
                <small>珍藏好奇与发现</small>
              </a>
              <a href="#shop-section-consumables">
                <img src="/assets/shop/max-cartoon-v1/fortune_bag.webp" alt="" aria-hidden="true" />
                <span>消耗品</span>
                <small>为下一次尝试补给</small>
              </a>
              <a href="#shop-section-companions">
                <span
                  class="shop-category-sample"
                  data-shop-ranch-preview
                  aria-hidden="true"
                ></span>
                <span>伙伴</span>
                <small>草地上的小日常</small>
              </a>
            </nav>
            <div class="shop-sections" id="shop-grid"></div>
          </section>
        </section>
      </main>
    </div>
    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/max-ranch.js"></script>
    <script src="/profile-extras.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
