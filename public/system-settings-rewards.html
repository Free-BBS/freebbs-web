<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="为选中的同学批量追加电元或磁元奖励，发送站内到账通知并查询发放记录。"
    />
    <title>FREE-BBS - 奖励方案</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/admin-rewards.css" />
  </head>
  <body class="system-settings-page system-settings-rewards-page">
    <div class="page-shell page-shell-settings">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="主导航">
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="登录或注册">
                <img
                  class="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="当前用户头像"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="个人设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status" aria-label="账户资产">
              <span class="currency currency-electric" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-heat" aria-label="热力">
                <img class="currency-icon" src="/assets/icons/flame.svg" alt="" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航"></nav>

      <main
        class="main-content settings-main system-settings-main hidden"
        id="system-settings-content"
        data-admin-content
      >
        <section
          class="system-settings-shell system-settings-detail-shell"
          aria-labelledby="system-rewards-title"
        >
          <a class="system-settings-back" href="/system-settings">← 返回系统设置</a>

          <header class="system-settings-intro">
            <h1 class="visually-hidden" id="system-rewards-title">奖励方案</h1>
            <p>感谢每一份认真反馈。为选中的同学追加奖励，并同步发送站内到账通知。</p>
          </header>

          <form id="reward-form" class="reward-grid">
            <fieldset id="reward-fields">
              <legend>1 · 选择奖励方案</legend>
              <div class="reward-presets" aria-label="公测问题奖励">
                <button type="button" data-reward-amount="5">有效反馈 · 5 电元</button>
                <button type="button" data-reward-amount="10">实用建议 · 10 电元</button>
                <button type="button" data-reward-amount="20">重要问题 · 20 电元</button>
                <button type="button" data-reward-amount="50">重大贡献 · 50 电元</button>
              </div>
              <label
                >方案名称<input id="reward-title" maxlength="80" value="公测问题反馈奖励" required
              /></label>
              <div class="reward-amounts">
                <label
                  >每人增加电元<input
                    id="reward-electric"
                    type="number"
                    min="0"
                    max="1000000"
                    step="1"
                    value="5"
                    required
                /></label>
                <label
                  >每人增加磁元<input
                    id="reward-magnetic"
                    type="number"
                    min="0"
                    max="1000000"
                    step="1"
                    value="0"
                    required
                /></label>
              </div>
              <label
                >奖励原因<textarea
                  id="reward-reason"
                  maxlength="1000"
                  rows="3"
                  required
                  placeholder="例如：发现并协助复现讨论区分页问题，感谢你的认真反馈。"
                ></textarea>
              </label>
              <p class="reward-hint">
                金额追加到现有余额，不影响日常奖励上限；每种货币每人最高 1000000。
              </p>
              <h2>2 · 选择同学</h2>
              <label
                >搜索姓名、昵称或学号<input
                  id="reward-search"
                  type="search"
                  placeholder="输入关键词后点击搜索"
              /></label>
              <div class="reward-toolbar">
                <button id="reward-search-button" type="button">搜索</button>
                <button id="reward-select-page" type="button">选择当前结果</button>
                <button id="reward-clear" type="button">清空选择</button>
              </div>
              <p class="reward-hint" id="reward-search-status" role="status"></p>
              <div id="reward-users" class="reward-users"></div>
              <h3 id="reward-selection-count">已选择 0 人</h3>
              <div id="reward-selected" class="reward-selected"></div>
              <p class="reward-hint">
                每批最多 100 人；搜索后可继续追加选择。仅向确认名单中的同学发奖。
              </p>
            </fieldset>
            <div class="reward-submit-area">
              <p id="reward-summary" aria-live="polite"></p>
              <button class="system-settings-submit" id="reward-submit" type="submit">
                预览并确认奖励
              </button>
              <button id="reward-retry" type="button" hidden>重试当前发放</button>
              <p id="reward-status" role="status" aria-live="polite"></p>
            </div>
          </form>
          <section class="reward-history" aria-labelledby="reward-history-title">
            <div class="reward-toolbar">
              <h2 id="reward-history-title">发放记录</h2>
              <button id="reward-history-refresh" type="button">刷新记录</button>
            </div>
            <div id="reward-batches"></div>
            <button id="reward-history-more" type="button" hidden>加载更早记录</button>
          </section>
          <dialog id="reward-confirm" aria-labelledby="reward-confirm-title">
            <h2 id="reward-confirm-title">确认发放奖励</h2>
            <p id="reward-confirm-summary"></p>
            <div id="reward-confirm-list" class="reward-confirm-list"></div>
            <p>确认后立即追加余额并发送站内通知，请核对名单和金额。</p>
            <div class="reward-toolbar">
              <button id="reward-confirm-cancel" type="button">返回修改</button
              ><button id="reward-confirm-send" type="button">确认发放</button>
            </div>
          </dialog>
        </section>
      </main>
    </div>

    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/app.js"></script>
    <script src="/system-settings.js"></script>
    <script src="/admin-rewards.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
