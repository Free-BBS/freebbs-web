<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FREE-BBS - 学习世界</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/world.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
  </head>
  <body class="world-page">
    <div class="page-shell page-shell-world">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <form class="searchbar" id="world-search-form" role="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input
            id="world-search-input"
            type="search"
            placeholder="搜索知识点、课程区域"
            aria-label="搜索知识点"
            autocomplete="off"
          />
        </form>

        <nav class="nav-actions" aria-label="顶部导航">
          <a class="nav-link" href="/">
            <img class="nav-icon" src="/assets/icons/home.svg" alt="" aria-hidden="true" />
            <span>主页</span>
          </a>
          <a class="nav-link active" href="/world" aria-current="page">
            <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
            <span>学习世界</span>
          </a>
          <a class="nav-link" href="/discussion">
            <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
            <span>讨论</span>
          </a>
          <a class="nav-link" href="/aichat">
            <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
            <span>问问 Max</span>
          </a>
          <a class="nav-link fortune-link hidden" href="#">
            <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
            <span>今日运势</span>
          </a>
          <a class="nav-link manage-link hidden" href="/adminusers">
            <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
            <span>管理</span>
          </a>

          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status">
              <span class="currency currency-electric" data-tooltip="电元" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="电元" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" data-tooltip="磁元" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="磁元" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航">
        <a class="nav-link active" href="/world" aria-current="page">
          <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
          <span>学习世界</span>
        </a>
        <a class="nav-link" href="/discussion">
          <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
          <span>讨论</span>
        </a>
        <a class="nav-link" href="/aichat">
          <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
          <span>问问 Max</span>
        </a>
        <a class="nav-link fortune-link hidden" href="#">
          <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
          <span>今日运势</span>
        </a>
        <a class="nav-link manage-link hidden" href="/adminusers">
          <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
          <span>管理</span>
        </a>
      </nav>

      <main class="main-content world-main">
        <section class="study-world-shell" aria-label="学习世界">
          <header class="study-world-header">
            <p class="study-world-kicker">Learning Worlds</p>
            <h1>学习世界</h1>
          </header>

          <div class="study-world-carousel" aria-label="左右滑动选择学习世界">
            <button
              class="study-world-nav study-world-nav-prev"
              type="button"
              data-world-scroll="-1"
              aria-label="上一个学习世界"
            >
              ‹
            </button>
            <div
              class="study-world-track"
              id="study-world-track"
              tabindex="0"
              aria-live="polite"
            ></div>
            <button
              class="study-world-nav study-world-nav-next"
              type="button"
              data-world-scroll="1"
              aria-label="下一个学习世界"
            >
              ›
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
    <script src="/world.js"></script>
  </body>
</html>
