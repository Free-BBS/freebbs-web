<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="选择一个课程岛屿，进入对应的学习地图或讨论区。" />
    <title>FREE-BBS - 学习世界</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/world.css" />
    <link rel="stylesheet" href="/planet-materials.css" />
    <link rel="stylesheet" href="/course-orbit.css" />
  </head>
  <body class="world-page">
    <div class="page-shell page-shell-world">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="顶部导航">
          <a class="nav-link" href="/">
            <img class="nav-icon" src="/assets/icons/home.svg" alt="" aria-hidden="true" />
            <span>主页</span>
          </a>
          <a class="nav-link active" href="/world" aria-current="page">
            <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
            <span>学习世界</span>
          </a>
          <a class="nav-link" href="/discussion">
            <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
            <span>讨论</span>
          </a>
          <a class="nav-link" href="/aichat">
            <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
            <span>问问 Max</span>
          </a>
          <a class="nav-link fortune-link hidden" href="#">
            <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
            <span>今日运势</span>
          </a>
          <a class="nav-link manage-link hidden" href="/adminusers">
            <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
            <span>管理</span>
          </a>

          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status">
              <span class="currency currency-electric" data-tooltip="电元" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="电元" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" data-tooltip="磁元" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="磁元" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航">
        <a class="nav-link active" href="/world" aria-current="page">
          <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
          <span>学习世界</span>
        </a>
        <a class="nav-link" href="/discussion">
          <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
          <span>讨论</span>
        </a>
        <a class="nav-link" href="/aichat">
          <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
          <span>问问 Max</span>
        </a>
        <a class="nav-link fortune-link hidden" href="#">
          <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
          <span>今日运势</span>
        </a>
        <a class="nav-link manage-link hidden" href="/adminusers">
          <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
          <span>管理</span>
        </a>
      </nav>

      <main class="main-content world-main">
        <section
          class="world-explorer"
          id="world-explorer"
          data-world-view="orbit"
          aria-labelledby="world-page-title"
        >
          <header class="world-explorer-intro">
            <p class="world-explorer-kicker">LEARNING WORLD · SIX KNOWLEDGE ISLANDS</p>
            <h1 id="world-page-title">探索六大知识岛</h1>
            <p>转动知识轨道，选择一座岛屿查看板块概览，再进入其中的课程小星球。</p>
          </header>

          <div class="world-orbit-shell">
            <button
              class="world-orbit-control world-orbit-control-prev"
              type="button"
              data-orbit-step="-1"
              aria-controls="world-orbit"
              aria-label="向左转动知识岛轨道"
            >
              <span aria-hidden="true">‹</span>
            </button>

            <div
              class="world-orbit"
              id="world-orbit"
              data-orbit-offset="0"
              tabindex="0"
              aria-label="六座知识岛围绕 FREE-BBS 学习中枢"
              aria-describedby="world-orbit-instruction"
            >
              <div class="world-orbit-track" id="world-orbit-track">
                <button
                  class="island-orbit-item is-active is-orbit-visible"
                  type="button"
                  data-world-index="0"
                  data-world-id="mathematics"
                  data-status="active"
                  data-world-state="active"
                  data-orbit-slot="0"
                  data-orbit-position="0"
                  data-hidden="false"
                  style="--orbit-slot: 0"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看数学基础知识岛概览"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source media="(max-width: 640px)" srcset="/assets/math_island_mobile.webp" />
                      <img src="/assets/math_island.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 已开放</small>
                    <strong>数学基础</strong>
                    <span>查看板块 ↗</span>
                  </span>
                </button>

                <button
                  class="island-orbit-item is-coming is-orbit-visible"
                  type="button"
                  data-world-index="1"
                  data-world-id="physics"
                  data-status="coming"
                  data-world-state="coming"
                  data-orbit-slot="1"
                  data-orbit-position="1"
                  data-hidden="false"
                  style="--orbit-slot: 1"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看物理本质知识岛规划，敬请期待"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source
                        media="(max-width: 640px)"
                        srcset="/assets/physics_island_v2_mobile.webp"
                      />
                      <img src="/assets/physics_island_v2.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 建设中</small>
                    <strong>物理本质</strong>
                    <span>敬请期待</span>
                  </span>
                </button>

                <button
                  class="island-orbit-item is-active is-hidden-behind-core"
                  type="button"
                  data-world-index="2"
                  data-world-id="circuits"
                  data-status="active"
                  data-world-state="active"
                  data-orbit-slot="2"
                  data-orbit-position="2"
                  data-hidden="true"
                  style="--orbit-slot: 2"
                  tabindex="-1"
                  aria-hidden="true"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看电路架构知识岛概览"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source
                        media="(max-width: 640px)"
                        srcset="/assets/circuits_island_mobile.webp"
                      />
                      <img src="/assets/circuits_island.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 已开放</small>
                    <strong>电路架构</strong>
                    <span>查看板块 ↗</span>
                  </span>
                </button>

                <button
                  class="island-orbit-item is-active is-orbit-visible"
                  type="button"
                  data-world-index="3"
                  data-world-id="signals"
                  data-status="active"
                  data-world-state="active"
                  data-orbit-slot="4"
                  data-orbit-position="4"
                  data-hidden="false"
                  style="--orbit-slot: 4"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看信号系统知识岛概览"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source
                        media="(max-width: 640px)"
                        srcset="/assets/signals_island_mobile.webp"
                      />
                      <img src="/assets/signals_island.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 已开放</small>
                    <strong>信号系统</strong>
                    <span>查看板块 ↗</span>
                  </span>
                </button>

                <button
                  class="island-orbit-item is-coming is-hidden-behind-core"
                  type="button"
                  data-world-index="4"
                  data-world-id="computing"
                  data-status="coming"
                  data-world-state="coming"
                  data-orbit-slot="3"
                  data-orbit-position="3"
                  data-hidden="true"
                  style="--orbit-slot: 3"
                  tabindex="-1"
                  aria-hidden="true"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看计算机科学知识岛规划，敬请期待"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source
                        media="(max-width: 640px)"
                        srcset="/assets/digital_island_mobile.webp"
                      />
                      <img src="/assets/digital_island.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 建设中</small>
                    <strong>计算机科学</strong>
                    <span>敬请期待</span>
                  </span>
                </button>

                <button
                  class="island-orbit-item is-coming is-orbit-visible"
                  type="button"
                  data-world-index="5"
                  data-world-id="laboratory"
                  data-status="coming"
                  data-world-state="coming"
                  data-orbit-slot="5"
                  data-orbit-position="5"
                  data-hidden="false"
                  style="--orbit-slot: 5"
                  aria-haspopup="dialog"
                  aria-controls="world-modal"
                  aria-label="查看实验能力知识岛规划，敬请期待"
                >
                  <span class="island-orbit-visual" aria-hidden="true">
                    <picture>
                      <source
                        media="(max-width: 640px)"
                        srcset="/assets/laboratory_island_v2_mobile.webp"
                      />
                      <img src="/assets/laboratory_island_v2.webp" alt="" draggable="false" />
                    </picture>
                  </span>
                  <span class="island-orbit-copy">
                    <small>ISLAND · 建设中</small>
                    <strong>实验能力</strong>
                    <span>敬请期待</span>
                  </span>
                </button>
              </div>

              <button
                class="world-core"
                id="world-core"
                type="button"
                aria-pressed="false"
                aria-controls="world-orbit"
                aria-describedby="world-orbit-instruction"
                aria-label="FREE-BBS 学习中枢，点击开启滚轮旋转"
              >
                <span class="world-core-ring world-core-ring-back" aria-hidden="true"></span>
                <span class="world-core-surface" aria-hidden="true"></span>
                <span class="world-core-ring world-core-ring-front" aria-hidden="true"></span>
                <span class="world-core-halo" aria-hidden="true"></span>
                <span class="world-core-identity">
                  <img src="/assets/freebbs-emblem-v2.png" alt="" aria-hidden="true" />
                  <span class="world-core-copy">
                    <span class="world-core-kicker">LEARNING CORE</span>
                    <strong>FREE-BBS</strong>
                    <span class="world-core-description">知识在这里汇流</span>
                  </span>
                </span>
              </button>
            </div>

            <button
              class="world-orbit-control world-orbit-control-next"
              type="button"
              data-orbit-step="1"
              aria-controls="world-orbit"
              aria-label="向右转动知识岛轨道"
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>
          <div class="world-orbit-footer">
            <p class="world-orbit-instruction" id="world-orbit-instruction" aria-live="polite">
              点击中央星球后，用滚轮旋转知识岛；点击外部恢复页面滚动。也可使用左右按钮、方向键或横向滑动。
            </p>
            <p class="world-orbit-status" id="world-orbit-status" aria-live="polite"></p>
          </div>
        </section>

        <section
          class="island-course-stage"
          id="island-course-stage"
          data-stage-state="closed"
          aria-labelledby="island-course-title"
          hidden
        >
          <header class="island-course-stage-header">
            <button class="island-course-back" id="island-course-back" type="button">
              <span aria-hidden="true">←</span>
              返回知识群岛
            </button>
            <div class="island-course-heading">
              <p id="island-course-code"></p>
              <h2 id="island-course-title" tabindex="-1"></h2>
              <p id="island-course-description"></p>
            </div>
          </header>

          <div
            class="island-course-system"
            id="island-course-system"
            data-rotation-active="false"
            tabindex="0"
            aria-label="围绕知识岛的课程轨道"
            aria-describedby="island-course-instruction"
          >
            <button
              class="island-course-control island-course-control-prev"
              type="button"
              data-course-step="-1"
              aria-controls="island-course-orbit"
              aria-label="向左转动课程轨道"
            >
              <span aria-hidden="true">‹</span>
            </button>
            <div
              class="island-course-orbit"
              id="island-course-orbit"
              role="list"
              aria-label="板块课程"
              data-course-offset="0"
            ></div>
            <button
              class="island-course-hub"
              id="island-course-hub"
              type="button"
              aria-pressed="false"
              aria-controls="island-course-orbit"
              aria-describedby="island-course-instruction"
              aria-label="点击知识岛开启课程滚轮旋转"
            >
              <img id="island-course-hub-image" alt="" aria-hidden="true" draggable="false" />
            </button>
            <button
              class="island-course-control island-course-control-next"
              type="button"
              data-course-step="1"
              aria-controls="island-course-orbit"
              aria-label="向右转动课程轨道"
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>
          <p
            class="island-course-instruction"
            id="island-course-instruction"
            aria-live="polite"
          ></p>
          <p class="island-course-status" id="island-course-status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <dialog
      class="world-modal"
      id="world-modal"
      aria-labelledby="world-modal-title"
      aria-describedby="world-modal-description"
    >
      <section class="world-modal-panel">
        <button class="world-modal-close" type="button" data-close-modal aria-label="关闭弹窗">
          <span aria-hidden="true">×</span>
        </button>

        <div class="world-modal-visual" id="world-modal-visual" aria-hidden="true">
          <img id="world-modal-image" alt="" />
          <span class="world-modal-symbol" id="world-modal-symbol" hidden></span>
          <span>ISLAND OVERVIEW</span>
        </div>

        <div class="world-modal-intro">
          <p class="world-modal-kicker" id="world-modal-kicker">学习岛屿</p>
          <h2 id="world-modal-title"></h2>
          <p class="world-modal-status" id="world-modal-status"></p>
          <p id="world-modal-description"></p>
          <p class="world-modal-topics" id="world-modal-topics"></p>

          <div class="world-modal-actions">
            <button
              class="world-modal-action world-modal-action-enter"
              id="world-enter-island"
              type="button"
            >
              进入板块课程
            </button>
            <a
              class="world-modal-action world-modal-action-discussion"
              id="world-discussion-link"
              href="/discussion"
            >
              进入讨论
            </a>
          </div>
        </div>
      </section>
    </dialog>

    <script src="/app.js"></script>
    <script src="/world.js"></script>
  </body>
</html>
