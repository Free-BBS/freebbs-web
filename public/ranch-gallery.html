<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/typography-preferences.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="/development-commerce-embed.js"></script>
    <title>FREE-BBS - 羊群广场</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-v2-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/freebbs-apple-touch-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/profile-extras.css" />
    <link rel="stylesheet" href="/economy.css" />
    <link rel="stylesheet" href="/ranch-creative.css" />
    <link rel="stylesheet" href="/development-commerce-embed.css" />
  </head>
  <body class="ranch-creative-page ranch-gallery-page">
    <div class="page-shell page-shell-settings">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <form class="searchbar" role="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input type="search" placeholder="搜索课程、讨论、资料、地图坐标" aria-label="搜索" />
        </form>

        <nav class="nav-actions" aria-label="顶部导航">
          <a class="nav-link" href="/">
            <img class="nav-icon" src="/assets/icons/home.svg" alt="" aria-hidden="true" />
            <span>主页</span>
          </a>
          <a class="nav-link" href="/world">
            <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
            <span>学习世界</span>
          </a>
          <a class="nav-link" href="/discussion">
            <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
            <span>讨论</span>
          </a>
          <a class="nav-link" href="/aichat">
            <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
            <span>问问 Max</span>
          </a>
          <a class="nav-link fortune-link hidden" href="#">
            <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
            <span>今日运势</span>
          </a>
          <a class="nav-link manage-link hidden" href="/adminusers">
            <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
            <span>管理</span>
          </a>

          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status">
              <span class="currency currency-electric" data-tooltip="电元" aria-label="电元">
                <img class="currency-icon" src="/assets/icons/electron.svg" alt="电元" />
                <span class="currency-value">-</span>
              </span>
              <span class="currency currency-magnetic" data-tooltip="磁元" aria-label="磁元">
                <img class="currency-icon" src="/assets/icons/magnetron.svg" alt="磁元" />
                <span class="currency-value">-</span>
              </span>
            </div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航">
        <a class="nav-link" href="/world">
          <img class="nav-icon" src="/assets/icons/map.svg" alt="" aria-hidden="true" />
          <span>学习世界</span>
        </a>
        <a class="nav-link" href="/discussion">
          <img class="nav-icon" src="/assets/icons/people.svg" alt="" aria-hidden="true" />
          <span>讨论</span>
        </a>
        <a class="nav-link" href="/aichat">
          <img class="nav-icon" src="/assets/icons/ai.svg" alt="" aria-hidden="true" />
          <span>问问 Max</span>
        </a>
        <a class="nav-link fortune-link hidden" href="#">
          <img class="nav-icon" src="/assets/icons/yunshi.svg" alt="" aria-hidden="true" />
          <span>今日运势</span>
        </a>
        <a class="nav-link manage-link hidden" href="/adminusers">
          <img class="nav-icon" src="/assets/icons/gear.svg" alt="" aria-hidden="true" />
          <span>管理</span>
        </a>
      </nav>

      <main class="main-content ranch-creative-main ranch-community-main">
        <section class="community-pasture-page" aria-labelledby="community-title">
          <div class="community-pasture" id="community-pasture">
            <div class="community-sky-glow" aria-hidden="true"></div>
            <div class="community-clouds" aria-hidden="true"><i></i><i></i><i></i></div>
            <header class="community-heading">
              <div>
                <a href="/ranch" data-own-ranch>‹ 我的牧场</a>
                <h1 id="community-title">大家的牧场</h1>
                <span id="gallery-status" role="status" aria-live="polite">羊群正在赶来…</span>
                <span id="community-wind-status" class="community-wind-status" hidden></span>
              </div>
              <div class="community-heading-tools">
                <button
                  id="community-clover"
                  type="button"
                  hidden
                  title="使用一片三叶草：3 秒内吹飞空中羊，5 秒后飘回"
                >
                  <img src="/assets/icons/ranch-clover.svg" alt="" aria-hidden="true" />
                  <span>三叶草</span>
                </button>
                <label class="community-scene-picker">
                  <span>散步场景</span>
                  <select id="community-scene" aria-label="选择公共牧场场景">
                    <option value="meadow">草甸</option>
                    <option value="lake">湖畔</option>
                    <option value="courtyard">庭院</option>
                    <option value="wall">长城</option>
                  </select>
                </label>
              </div>
            </header>
            <div class="community-clover-wind" aria-hidden="true">
              <img src="/assets/icons/ranch-clover.svg" alt="" />
              <img src="/assets/icons/ranch-clover.svg" alt="" />
              <img src="/assets/icons/ranch-clover.svg" alt="" />
            </div>

            <div
              id="community-flock"
              class="community-flock"
              aria-label="正在公共牧场散步的羊群"
            ></div>

            <aside class="community-interaction" id="community-interaction" hidden>
              <div class="community-selected-copy">
                <strong id="community-selected-name"></strong>
                <span id="community-selected-detail"></span>
              </div>
              <div class="community-actions" aria-label="与这只羊互动">
                <button type="button" data-community-action="greet">打招呼</button>
                <button type="button" data-community-action="stroll">一起散步</button>
                <button type="button" data-community-action="pet">摸摸它</button>
                <button type="button" data-community-action="backflip" hidden>后空翻</button>
                <button type="button" data-community-action="bicycle" hidden>骑自行车</button>
                <button type="button" data-community-action="fly" hidden>起飞</button>
                <label class="community-gear" id="community-gear-control" hidden
                  >出行
                  <select id="community-gear" aria-label="出行装备">
                    <option value="walk">步行</option>
                    <option value="bicycle">自行车</option>
                    <option value="wing">中国羊能飞</option>
                  </select>
                </label>
                <a id="community-visit" href="/ranch">逛逛 TA 的牧场</a>
              </div>
              <button
                class="community-close"
                type="button"
                data-community-close
                aria-label="关闭互动栏"
              >
                ×
              </button>
            </aside>

            <nav class="community-corner-links" aria-label="牧场快捷操作">
              <button type="button" id="community-find-mine" hidden>找到我的羊</button>
              <a href="/ranch-dye">给我的羊染色</a>
              <span aria-hidden="true">·</span>
              <a href="/ranch" data-own-ranch>照顾我的 Max</a>
            </nav>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-block footer-left">
          <p>© Free-bbs 工作组 2026-2027</p>
        </div>

        <div class="footer-block footer-center">
          <div class="footer-links">
            <a href="#staff">工作人员名单</a>
            <a href="https://www.ee.tsinghua.edu.cn/" target="_blank" rel="noreferrer"
              >清华大学电子系</a
            >
            <a href="https://www.eesast.com">电子系学生科协</a>
          </div>
          <p>&lt;京ICP备2025155858号-2&gt;</p>
        </div>

        <div class="footer-block footer-right">
          <p><a href="mailto:feedback@free-bbs.cn">反馈：feedback@free-bbs.cn</a></p>
        </div>
      </footer>
    </div>

    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/max-ranch.js"></script>
    <script src="/ranch-environment.js"></script>
    <script src="/ranch-design-data.js"></script>
    <script src="/ranch-design.js"></script>
    <script src="/request-runtime.js"></script>
    <script src="/ui-state.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
    <script src="/ranch-world-data.js"></script>
    <script src="/ranch-gallery.js"></script>
  </body>
</html>
