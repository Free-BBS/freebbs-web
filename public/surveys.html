<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>活动报名 · FREE-BBS</title>
    <link rel="icon" href="/assets/favicon-v2-32.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/surveys.css" />
  </head>
  <body class="activities-page">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="主导航">
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status"></div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航"></nav>

      <main class="main-content activities-main">
        <header class="activity-hero">
          <span class="activity-eyebrow">FREE-BBS · CAMPUS LIFE</span>
          <p class="kicker">发现 · 参与 · 一起创造</p>
          <h1>你的下一次参与，<br /><span>从这里开始。</span></h1>
          <p>
            系统体验、校园共创，找到你感兴趣的活动。所有活动均可直接浏览，报名要求由活动主办方设置。
          </p>
          <div class="activity-hero-links">
            <a class="button" href="/surveys">浏览全部活动 <span aria-hidden="true">↗</span></a
            ><span class="muted">公开浏览 · 在线报名 · 回执查签</span>
          </div>
        </header>
        <div id="message" role="status" aria-live="polite"></div>
        <div id="content"><p>正在加载活动…</p></div>
        <section class="card" id="lookup" hidden>
          <h2>查询我的抽签结果</h2>
          <p class="muted">输入报名成功时保存的回执。回执仅供本人使用，请妥善保管。</p>
          <form id="lookup-form">
            <label
              >报名回执<input
                name="receipt"
                required
                pattern="[a-f0-9]{64}"
                autocomplete="off" /></label
            ><button>查询结果</button>
          </form>
          <p id="result" role="status"></p>
        </section>
      </main>
    </div>
    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/surveys-common.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
    <script src="/survey-receipts.js"></script>
    <script src="/surveys.js"></script>
  </body>
</html>
