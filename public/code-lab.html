<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>代码实验室 | FREE BBS</title>
    <meta name="description" content="运行代码、观察变量、多架构汇编与仿真波形，分享实验到讨论区" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-v2-64.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-polish.css" />
    <link rel="stylesheet" href="/username-guard.css" />
    <link rel="stylesheet" href="/notifications.css" />
    <link rel="stylesheet" href="/layout-fixes.css" />
    <link rel="stylesheet" href="/language-lab.css" />
    <link rel="stylesheet" href="/lab-results.css" />
  </head>
  <body class="language-lab-page">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="FREE-BBS 首页">
          <span class="brand-mark">FREE<br />BBS</span>
        </a>

        <nav class="nav-actions" aria-label="主导航">
          <div class="user-panel" id="user-panel">
            <div class="user-summary">
              <button class="avatar" type="button" aria-label="用户头像">
                <img
                  class="avatar-image"
                  id="avatar-image"
                  src="/assets/avatar_placeholder.webp"
                  alt="用户头像占位图"
                />
              </button>
              <div class="user-actions" id="user-actions">
                <button
                  class="user-icon-button hidden"
                  id="user-settings-button"
                  type="button"
                  aria-label="设置"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/gear.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>设置</span>
                </button>
                <button
                  class="user-icon-button hidden"
                  id="user-logout-button"
                  type="button"
                  aria-label="退出"
                >
                  <img
                    class="user-action-icon"
                    src="/assets/icons/exit.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>退出</span>
                </button>
              </div>
              <div class="user-copy">
                <button class="user-name" type="button" id="user-name">登录/注册</button>
                <div class="user-role" id="user-role">学生</div>
              </div>
            </div>
            <div class="user-status" id="user-status"></div>
          </div>
        </nav>
      </header>

      <nav class="mobile-nav" aria-label="手机底部导航"></nav>

      <main class="main-content language-lab-main">
        <header class="lab-heading">
          <div>
            <a href="/laboratory" class="lab-back">← 实验室</a>
            <p class="lab-eyebrow">CODE · OBSERVE · SHARE</p>
            <h1>代码实验室</h1>
            <p id="lab-description">从一行代码开始，看看计算如何发生。</p>
          </div>
          <div class="lab-share-box">
            <button type="button" id="lab-share" class="lab-primary">分享到讨论区 ↗</button
            ><small>保存代码与结果的公开快照</small>
          </div>
        </header>
        <nav class="lab-languages" aria-label="实验语言">
          <button type="button" data-language="c">C</button
          ><button type="button" data-language="cpp">C++</button
          ><button type="button" data-language="python">Python</button
          ><button type="button" data-language="matlab">MATLAB</button
          ><button type="button" data-language="verilog">Verilog</button>
        </nav>
        <div id="lab-status" role="status" aria-live="polite">正在检查运行环境…</div>
        <div class="lab-workspace">
          <section class="lab-source-panel" aria-label="源代码编辑器">
            <div class="lab-panel-title">
              <label for="lab-title">实验名称</label
              ><button type="button" id="lab-example">载入示例</button
              ><button type="button" id="lab-download">下载代码</button>
            </div>
            <input
              id="lab-title"
              maxlength="120"
              aria-label="实验名称"
              placeholder="给这次实验起个名字"
            />
            <div class="lab-editor">
              <pre id="lab-lines" aria-hidden="true">1</pre>
              <textarea
                id="lab-source"
                aria-label="源代码"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                wrap="off"
              ></textarea>
            </div>
            <div class="lab-run-options">
              <label id="lab-optimization-label"
                >优化级别
                <select id="lab-optimization">
                  <option value="0">-O0</option>
                  <option value="1">-O1</option>
                  <option value="2">-O2</option>
                  <option value="3">-O3</option>
                  <option value="s">-Os</option>
                </select></label
              >
              <label id="lab-speed-label" hidden
                >每行间隔（秒）
                <input id="lab-speed" type="number" min="0" max="5" step="0.1" value="1"
              /></label>
              <button type="button" id="lab-run" class="lab-primary" disabled>运行实验</button
              ><button type="button" id="lab-stop" disabled>停止</button>
            </div>
            <div id="lab-python-controls" hidden>
              <button type="button" id="lab-pause" disabled>暂停</button
              ><button type="button" id="lab-step">单步执行</button
              ><span id="lab-position">等待运行</span>
            </div>
            <details class="lab-input">
              <summary>标准输入 stdin</summary>
              <textarea
                id="lab-stdin"
                aria-label="标准输入"
                rows="3"
                placeholder="每次 input / scanf 读取的数据按行填写"
              ></textarea>
            </details>
            <p class="lab-hint" id="lab-runtime-note"></p>
          </section>
          <section class="lab-output-panel" aria-label="实验结果">
            <div class="lab-panel-title">
              <h2>观察窗口</h2>
              <span id="lab-result-state">尚未运行</span>
            </div>
            <nav id="lab-result-tabs" class="lab-result-tabs" aria-label="结果类型"></nav>
            <div id="lab-result"><p class="lab-empty">运行后，这里会显示汇编、变量或波形。</p></div>
            <details open class="lab-output">
              <summary>终端输出</summary>
              <pre id="lab-console" class="lab-console">等待运行…</pre>
            </details>
          </section>
        </div>
      </main>
      <footer class="site-footer site-footer-compact">
        <nav class="footer-links" aria-label="关于平台">
          <a href="/about">关于 FREE BBS</a>
          <a href="/staff">FREE BBS 工作人员名单</a>
          <a href="https://www.ee.tsinghua.edu.cn/" target="_blank" rel="noreferrer"
            >清华大学电子系</a
          >
          <a href="https://www.eesast.com">电子系学生科协</a>
        </nav>
        <div class="footer-meta">
          <p>© 2026-2027 FREE BBS 工作组</p>
          <p>京ICP备2025155858号-2</p>
        </div>
      </footer>
    </div>
    <script src="/typography.js"></script>
    <script src="/username-guard.js"></script>
    <script src="/app.js"></script>
    <script src="/notifications.js"></script>
    <script src="/lab-results.js"></script>
    <script src="/language-lab.js"></script>
  </body>
</html>
