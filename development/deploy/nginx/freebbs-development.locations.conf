# Legacy main-site entries open the released app, preserving query parameters.
location = /development {
  return 302 /development/$is_args$args;
}

location = /development.html {
  return 302 /development/$is_args$args;
}

# Submitted department sites must not fall back to the SPA or inherit X-Frame-Options DENY.
# Repeat security headers because add_header in this location stops header inheritance.
location ^~ /development/organization-showcase/ {
  root /usr/share/nginx/html;
  try_files $uri $uri/ =404;
  autoindex off;
  etag on;
  limit_except GET { deny all; }
  default_type application/octet-stream;
  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/json json;
    text/plain txt md;
    text/csv csv;
    image/png png;
    image/jpeg jpg jpeg;
    image/svg+xml svg;
    image/webp webp;
    image/avif avif;
    image/gif gif;
    image/x-icon ico;
    video/mp4 mp4 m4v;
    video/webm webm;
    audio/mpeg mp3;
    audio/wav wav;
    audio/mp4 m4a;
    audio/ogg ogg;
    font/woff woff;
    font/woff2 woff2;
    font/ttf ttf;
    font/otf otf;
    application/pdf pdf;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cache-Control "no-cache" always;
}

location /development/ {
  root /usr/share/nginx/html;
  try_files $uri $uri/ /development/index.html;
}

location /api/development/v1/ {
  client_max_body_size 101m;
  client_body_timeout 300s;
  proxy_pass http://127.0.0.1:3100;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Request-Id $http_x_request_id;
  proxy_connect_timeout 3s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
