<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img"><title>E起向未来｜AI时代真实学习与科创育人</title><rect width="1500" height="700" rx="22" fill="#eef1e5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173f39"><text x="55" y="75" font-size="32" font-weight="600">E起向未来｜AI时代真实学习与科创育人</text><rect x="55" y="130" width="430" height="400" rx="16" fill="#dbe8c5"/><g fill="#173f39"><text x="83" y="185" font-size="28" font-weight="600">问题与课堂证据</text><text x="83" y="248" font-size="23">工具使用不等于知识掌握</text><text x="83" y="302" font-size="23">任务是否保留学生思考？</text><text x="83" y="356" font-size="23">表达与操作能否检验理解？</text><text x="83" y="410" font-size="23">案例分析 · 评价效度</text></g><text x="493" y="330" font-size="30">→</text><rect x="535" y="130" width="430" height="400" rx="16" fill="#173f39"/><g fill="#f4f4e8"><text x="563" y="185" font-size="28" font-weight="600">教学支持与自主学习</text><text x="563" y="248" font-size="23">教师：目标 · 任务 · 证据对齐</text><text x="563" y="302" font-size="23">学生：尝试 · 求助 · 核验</text><text x="563" y="356" font-size="23">提供适度帮助，保留主动性</text><text x="563" y="410" font-size="23">解释 · 验证 · 迁移</text></g><text x="973" y="330" font-size="30">→</text><rect x="1015" y="130" width="430" height="400" rx="16" fill="#dbe8c5"/><g fill="#173f39"><text x="1043" y="185" font-size="28" font-weight="600">大学教育与持续学习</text><text x="1043" y="248" font-size="23">课程考核检查个人理解</text><text x="1043" y="302" font-size="23">自主组织专业知识与学习</text><text x="1043" y="356" font-size="23">FREE BBS连接资源与同伴</text><text x="1043" y="410" font-size="23">讨论 · 计划 · 实验探索</text></g><rect x="55" y="575" width="1390" height="75" rx="12" fill="#cbdcb4"/><text x="750" y="623" text-anchor="middle" font-size="25">以独立运用知识的表现，检验学习是否真正发生</text></g></svg>